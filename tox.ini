# tox            build everything, then run all tests
# tox -e tests      run the tests only (uses the existing builds)
# tox -e tests -- -k orientation   pass options to pytest
#
# The Homebrew tools the tests use (wasmtime, exiftool, jpeg-xl) must be
# installed; see tests/README.md.

[tox]
envlist = build, tests
no_package = true

[testenv:tests]
description = run the tests
deps = -r tests/requirements.txt
passenv = CI
commands = pytest {posargs}

[testenv:build]
description = build the encoders and the unsigned shortcuts the tests use
deps =
allowlist_externals = {toxinidir}/shortcuts/*/scripts/*.sh
commands =
    {toxinidir}/shortcuts/compress-photos/scripts/build-wasm.sh
    {toxinidir}/shortcuts/compress-photos/scripts/build-native.sh
    {toxinidir}/shortcuts/compress-photos/scripts/build-macos.sh
    python {toxinidir}/shortcuts/compress-photos/scripts/build_shortcuts.py --guess --no-sign
    python {toxinidir}/shortcuts/compress-photos/scripts/build_mac_shortcuts.py --guess --no-sign
