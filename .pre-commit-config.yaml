---
# Third-party code (stb_image.h) and generated files keep their own format.
exclude: ^shortcuts/[^/]+/third_party/|^shortcuts/[^/]+/src/selftest_heic\.h$
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
  - repo: https://github.com/jsh9/muff-pre-commit
    rev: 0.15.20
    hooks:
      - id: muff-format
        args: [--config, muff.toml]
  - repo: https://github.com/lyz-code/yamlfix
    rev: 1.19.1
    hooks:
      - id: yamlfix
  - repo: https://github.com/hukkin/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap=79, --number]
        additional_dependencies: [mdformat-gfm]
  - repo: https://github.com/jsh9/markdown-heading-numbering
    rev: 0.1.1
    hooks:
      - id: markdown-heading-numbering
        exclude: ^CHANGELOG\.md$
  - repo: https://github.com/jsh9/markdown-toc-creator
    rev: 0.1.3
    hooks:
      - id: markdown-toc-creator
        exclude: ^CHANGELOG\.md$
  - repo: https://github.com/jsh9/format-docstring
    rev: 0.4.0
    hooks:
      - id: format-docstring
        name: Format docstrings in .py files
        args: [--line-length=79]
  - repo: https://github.com/jsh9/blank-line-after-blocks
    rev: 0.1.4
    hooks:
      - id: blank-line-after-blocks
  - repo: local
    hooks:
      - id: check-changelog
        name: CHANGELOG.md has an entry for each shortcut's VERSION
        entry: python3 scripts/check_changelog.py
        language: system
        files: ^(CHANGELOG\.md|shortcuts/[^/]+/VERSION)$
        pass_filenames: false
